server_id = "mcp_marketing"
display_name = "Marketing"
version = "1.1.0"
domain = "marketing"
sdk_version = "0.2.0"
risk_level = "medium"
writes_allowed = "gated"
transports = ["stdio"]
credentials = []
governance_gates = ["mrtr_approval"]
environments = ["development", "staging", "production"]

[[tools]]
name = "list_campaigns"
description = "List campaigns filtered by status (draft, active, paused, completed) or channel"
risk_class = "read_only"
requires_approval = false
credential_bindings = []

