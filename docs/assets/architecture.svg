  <text x="780" y="370" text-anchor="middle" fill="#fbbf24" font-size="8">📺 Ads</text>
  <text x="840" y="370" text-anchor="middle" fill="#a78bfa" font-size="8">🔗 Web</text>
  <text x="755" y="385" text-anchor="middle" fill="#64748b" font-size="7">LinkedIn · Twitter · Facebook · Instagram · Google · Meta · TikTok</text>

  <text x="480" y="425" text-anchor="middle" fill="#475569" font-size="10">mcp-marketing v1.0.0 · 22 tools · Multi-channel · Budget governance · Attribution · No data stored</text>
