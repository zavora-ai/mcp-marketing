  <text x="755" y="120" text-anchor="middle" fill="#64748b" font-size="8">HUBSPOT_ACCESS_TOKEN — campaigns, contacts, email, workflows</text>

  <rect x="600" y="145" width="310" height="50" rx="6" fill="#1e293b" stroke="#38bdf8"/>
